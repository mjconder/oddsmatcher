[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oddsmatcher"
version = "0.3.1"
description = "Aggregate bookmaker odds and show the best available price per outcome."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.2.2", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
oddsmatcher = "oddsmatcher.cli:main"

[tool.setuptools.packages.find]
include = ["oddsmatcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
